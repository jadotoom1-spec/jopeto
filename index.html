<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vide Wise</title>
<style>
:root{--bg:#f6f4f0;--fg:#1c1a17;--muted:#6f695f;--card:#ffffffcc;--line:#00000014;--accent:#6d4cff;--accent2:#ff6fae}
@media (prefers-color-scheme:dark){:root{--bg:#100f14;--fg:#efebe5;--muted:#9a948b;--card:#1d1b24cc;--line:#ffffff14;--accent:#9b85ff;--accent2:#ff8cc0}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;transition:background .6s}
#glow{position:fixed;inset:-20vmax;z-index:-1;filter:blur(80px);opacity:.35;transition:background .8s}
main{max-width:640px;margin:0 auto;padding:36px 16px 64px}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:24px}
h1{margin:0;font-size:2.2rem;letter-spacing:-.03em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:2px 0 0}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods button{font-size:2rem;padding:10px 0 6px;border:2px solid transparent;border-radius:16px;background:transparent;cursor:pointer;transition:transform .15s,border-color .15s;color:var(--fg)}
.moods button span{display:block;font-size:.7rem;color:var(--muted)}
.moods button:hover{transform:translateY(-3px)}
.moods button.on{border-color:var(--accent);transform:scale(1.06)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.tags button.on{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{width:100%;margin:14px 0 10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;min-height:70px;resize:vertical}
.primary{width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font-size:1.6rem}.stat small{color:var(--muted)}
svg{width:100%;height:120px;display:block}
.insight{margin:12px 0 0;color:var(--muted);font-size:.95rem}
ul{list-style:none;padding:0;margin:0}
li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
li:first-child{border-top:0}li .e{font-size:1.6rem}li small{color:var(--muted);display:block}
li .t{font-size:.75rem;color:var(--accent)}li .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font:inherit;font-size:.8rem;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;transition:transform .3s}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="glow"></div>
<main>
<header><div><h1>Vide Wise</h1><p class="sub">Check your vibe. Notice the pattern.</p></div><button class="ghost" id="export">Export</button></header>

<section class="card">
<h2>How's your vibe?</h2>
<div class="moods" id="moods"></div>
<div class="tags" id="tags"></div>
<textarea id="note" placeholder="What's shaping your vibe right now?"></textarea>
<button class="primary" id="save">Log vibe</button>
</section>

<section class="card">
<h2>Your pattern</h2>
<div class="stats">
<div class="stat"><b id="sAvg">–</b><small>avg (7 days)</small></div>
<div class="stat"><b id="sStreak">0</b><small>day streak</small></div>
<div class="stat"><b id="sCount">0</b><small>check-ins</small></div>
</div>
<svg id="chart" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
<p class="insight" id="insight">Log a few vibes to see insights.</p>
</section>

<section class="card">
<h2>History</h2>
<ul id="log"></ul>
</section>
</main>
<div id="toast"></div>
<script>
const M=[["😞","Low","#5b6b8c"],["😕","Meh","#7a7fa8"],["😐","Okay","#a49b8a"],["🙂","Good","#e2a24a"],["😄","Great","#ff6fae"]];
const T=["Sleep","Work","Friends","Family","Exercise","Food","Weather","Music","Alone time"];
let pick=null,tags=new Set();
const $=id=>document.getElementById(id);
const get=()=>{try{return JSON.parse(localStorage.vw||"[]")}catch{return[]}};
const put=v=>{try{localStorage.vw=JSON.stringify(v)}catch{}};
const esc=s=>s.replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const day=t=>new Date(t).toDateString();
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function glow(i){const c=i==null?"#6d4cff":M[i][2];$("glow").style.background=`radial-gradient(circle at 30% 20%,${c},transparent 60%)`}

M.forEach(([e,l],i)=>{const b=document.createElement("button");b.innerHTML=`${e}<span>${l}</span>`;b.onclick=()=>{pick=i;[...$("moods").children].forEach((c,j)=>c.classList.toggle("on",j===i));glow(i)};$("moods").append(b)});
T.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{tags.has(t)?tags.delete(t):tags.add(t);b.classList.toggle("on")};$("tags").append(b)});

function stats(d){
 $("sCount").textContent=d.length;
 const wk=d.filter(x=>Date.now()-x.t<7*864e5);
 $("sAvg").textContent=wk.length?M[Math.round(wk.reduce((a,x)=>a+x.m,0)/wk.length)][0]:"–";
 const days=new Set(d.map(x=>day(x.t)));let s=0,c=new Date();
 if(!days.has(c.toDateString()))c.setDate(c.getDate()-1);
 while(days.has(c.toDateString())){s++;c.setDate(c.getDate()-1)}
 $("sStreak").textContent=s;
 // chart: daily average for last 14 days
 const pts=[];for(let i=13;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const v=d.filter(x=>day(x.t)===dt.toDateString());pts.push(v.length?v.reduce((a,x)=>a+x.m,0)/v.length:null)}
 const xy=pts.map((v,i)=>v==null?null:[i*300/13,110-v*25]).filter(Boolean);
 const path=xy.map((p,i)=>(i?"L":"M")+p.join(",")).join("");
 $("chart").innerHTML=`<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>`+
  [0,1,2,3,4].map(i=>`<line x1="0" x2="300" y1="${110-i*25}" y2="${110-i*25}" stroke="var(--line)"/>`).join("")+
  (xy.length>1?`<path d="${path}" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`:"")+
  xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--accent)"/>`).join("");
 // insight: tag with best/worst average
 const by={};d.forEach(x=>(x.g||[]).forEach(t=>(by[t]=by[t]||[]).push(x.m)));
 const r=Object.entries(by).filter(([,v])=>v.length>=2).map(([t,v])=>[t,v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b)=>b[1]-a[1]);
 $("insight").textContent=r.length>=2?`✨ Your vibe is best around “${r[0][0]}” and lowest around “${r.at(-1)[0]}”.`:r.length?`✨ “${r[0][0]}” averages ${M[Math.round(r[0][1])][1].toLowerCase()}. Keep tagging for more insights.`:"Tag your check-ins to discover what lifts your vibe.";
}
function render(){
 const d=get();stats(d);
 $("log").innerHTML=d.length?d.slice(0,50).map((x,i)=>`<li><span class="e">${M[x.m][0]}</span><div>${x.n?esc(x.n):"<i>no note</i>"}${x.g&&x.g.length?`<div class="t">${x.g.map(esc).join(" · ")}</div>`:""}<small>${new Date(x.t).toLocaleString()}</small></div><button class="x" data-i="${i}" aria-label="Delete">×</button></li>`).join(""):'<li style="color:var(--muted)">No vibes yet. Log your first one above.</li>';
}
$("log").onclick=e=>{const i=e.target.dataset.i;if(i==null)return;const d=get();d.splice(+i,1);put(d);render();toast("Deleted")};
$("save").onclick=()=>{if(pick===null)return toast("Pick a vibe first");
 put([{m:pick,n:$("note").value.trim(),g:[...tags],t:Date.now()},...get()]);
 $("note").value="";tags.clear();[...$("tags").children].forEach(b=>b.classList.remove("on"));
 render();toast(pick>=3?"Nice vibe ✨":"Logged. Be kind to yourself 💜")};
$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(get(),null,2)],{type:"application/json"}));a.download="vide-wise.json";a.click()};
glow(null);render();
</script>
</body>
</html>
